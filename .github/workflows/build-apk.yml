name: Build Qobuz Chinese Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || { echo 'Android platform 35 missing'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo 'Android build tools 35 missing'; exit 1; }

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project or unzip source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [ -f settings.gradle ]; then
            PROJECT_DIR="$PWD"
          else
            PROJECT_DIR="$(find . -maxdepth 5 -type f -name settings.gradle -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*Qobuz*.zip' -print -quit)"
            if [ -z "$ZIP" ]; then
              ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            fi
            if [ -z "$ZIP" ]; then
              echo 'Cannot find settings.gradle or a source ZIP.'
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p "$RUNNER_TEMP/qobuz-source"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/qobuz-source"
            PROJECT_DIR="$(find "$RUNNER_TEMP/qobuz-source" -maxdepth 5 -type f -name settings.gradle -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo 'Cannot locate Android project settings.gradle after extraction.'
            exit 1
          fi
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "Android project located: $PROJECT_DIR"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QobuzChineseHiResHelper-debug
          path: app-debug.apk
          if-no-files-found: error
