name: Build Qobuz Chinese Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate newest ZIP or Android source
        shell: bash
        run: |
          set -euo pipefail
          # Prefer newest uploaded source ZIP, even when old source files still exist.
          ZIP="$(find . -maxdepth 4 -type f -iname 'QobuzChineseHiResHelper_v*.zip' -print | sort -V | tail -n 1)"
          if [ -n "$ZIP" ]; then
            echo "Using newest source: $ZIP"
            PROJECT_ROOT="$RUNNER_TEMP/qobuz-latest"
            mkdir -p "$PROJECT_ROOT"
            unzip -q "$ZIP" -d "$PROJECT_ROOT"
            PROJECT_DIR="$(find "$PROJECT_ROOT" -maxdepth 5 -name settings.gradle -type f -printf '%h\n' -quit)"
          else
            PROJECT_DIR="$(find . -maxdepth 5 -name settings.gradle -type f -printf '%h\n' -quit)"
          fi
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo 'No valid Android project found. Upload the complete source ZIP.' >&2
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$(realpath "$PROJECT_DIR")" >> "$GITHUB_ENV"
          echo "Selected source: $PROJECT_DIR"

      - name: Install Android SDK platform and build tools if necessary
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload latest APK
        uses: actions/upload-artifact@v4
        with:
          name: QobuzChineseHiResHelper-v1_2-debug
          path: app-debug.apk
          if-no-files-found: error
