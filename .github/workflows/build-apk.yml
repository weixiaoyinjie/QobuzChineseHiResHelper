name: Build Qobuz Chinese Helper v1.3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Select exactly the new v1.3 source ZIP (never old code)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="QobuzChineseHiResHelper_v1.3_fixed.zip"
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP not found: $SOURCE_ZIP" >&2
            echo "Upload that exact ZIP file to the repository's main branch." >&2
            exit 1
          fi
          unzip -t "$SOURCE_ZIP" >/dev/null
          PROJECT_DIR="$RUNNER_TEMP/qobuz-v1.3"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          MAIN="$PROJECT_DIR/app/src/main/java/com/qobuzchinese/helper/MainActivity.java"
          test -f "$MAIN"
          grep -Fq '"复制专辑名"' "$MAIN" || { echo 'ERROR: Album copy button missing' >&2; exit 1; }
          grep -Fq '返回找歌手' "$MAIN" || { echo 'ERROR: Back navigation missing' >&2; exit 1; }
          grep -Fq '"复制搜索词"' "$MAIN" || { echo 'ERROR: Qobuz copy shortcut missing' >&2; exit 1; }
          grep -Fq "versionName '1.3'" "$PROJECT_DIR/app/build.gradle" || { echo 'ERROR: Source is not v1.3' >&2; exit 1; }
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo 'Verified: v1.3 with copy, album, favorite, and back-button source.'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and verify APK includes v1.3 fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              dex = b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
          for label in ('复制专辑名', '复制搜索词', '返回找歌手', '打开 Qobuz'):
              if label.encode('utf-8') not in dex:
                  raise SystemExit('APK verification failed: missing UI string '+label)
          print('Verified: final APK contains new v1.3 button labels.')
          PY
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload confirmed v1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: QobuzChineseHiResHelper-v1.3-FIXED-APK
          path: app-debug.apk
          if-no-files-found: error
